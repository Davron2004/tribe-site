<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Members · The Tribe</title>
  <link rel="icon" href="../images/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="side">
    <div>
      <a class="logo" href="../"><img src="../images/logo.svg" alt="The Tribe"></a>
      <p class="intro">Ottawa's B2B networking community.</p>
      <nav>
        <a href="../">Home</a>
        <a href="./" aria-current="page">Members</a>
        <a href="../events/">Events</a>
      </nav>
    </div>
    <p class="credit">&copy; The Tribe &middot; Design: <a href="https://html5up.net">HTML5 UP</a></p>
  </header>
  <main>
    <div class="head">
      <div>
        <h1>Members</h1>
        <p class="lede">The people behind Ottawa's growing businesses.</p>
      </div>
    </div>
    <ul class="grid" id="members"></ul>
    <p class="state" id="status">Loading…</p>
  </main>

  <dialog class="modal" id="member" aria-label="Member details">
    <form method="dialog"><button class="close" aria-label="Close">&times;</button></form>
    <div class="body"></div>
  </dialog>

  <script src="../config.js"></script>
  <script src="../app.js"></script>
</body>
</html>
